[pytest]
# Root test suite (fast, no raw data). The sensor workspace has its own suite,
# run from inside it - see README "Verification":
#   cd Sensor_Systems_and_Telemetry_Integration
#   PYTHONPATH=integration_update/src python -m pytest -q tests frontend_adapter/test_adapter.py integration_update/tests
testpaths = tests
norecursedirs = Sensor_Systems_and_Telemetry_Integration .git data models reports results notebooks
addopts = -q
